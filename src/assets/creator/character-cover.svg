<!--
  The stand-in shown where a character has no cover of its own.

  This file used to hold a painting of one particular character, embedded as
  a raster, 137KB of it. That made every coverless character on the site wear
  that one face, and it kept an artwork in the repository purely as filler.
  This is a drawn placeholder instead: it says "no cover yet" and belongs to
  nobody.

  The outer path keeps the original shape, rounded on the right only, so it
  drops into the eight places that use it without any of them changing.
-->
<svg width="422" height="650" viewBox="0 0 422 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No cover yet">
  <defs>
    <clipPath id="card">
      <path d="M0 0H383C404.539 0 422 17.4609 422 39V611C422 632.539 404.539 650 383 650H0V0Z"/>
    </clipPath>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232d40"/>
      <stop offset="1" stop-color="#171f2e"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="422" height="650" fill="url(#panel)"/>

    <!-- A few soft bands, so the empty state is not a flat slab. -->
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="28">
      <path d="M-60 150 L480 -120"/>
      <path d="M-60 300 L480 30"/>
      <path d="M-60 450 L480 180"/>
      <path d="M-60 600 L480 330"/>
      <path d="M-60 750 L480 480"/>
    </g>

    <!-- Head and shoulders, unmistakably nobody. -->
    <g fill="#ffffff" fill-opacity="0.10">
      <circle cx="211" cy="286" r="54"/>
      <path d="M211 356c-58 0-105 40-105 90v34h210v-34c0-50-47-90-105-90Z"/>
    </g>
  </g>
</svg>
