<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>VantaOrigin: Your characters. One link.</title>
    <meta
      name="description"
      content="Create character cards, organize your characters, and share one simple page with anyone who wants to discover them."
    />
    <meta name="theme-color" content="#1b2233" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!--
      No canonical here on purpose. This file is served for every address the
      app draws in the browser, so one written in says that the terms, the
      contact page and everything else without a crawler route of its own are
      the front page wearing a different address. Google read it exactly that
      way and filed them under "alternate page with proper canonical tag",
      which is its way of saying it believed us.

      A page that knows its own address sets one as it loads; a page that does
      not is its own canonical by default, which is the right answer.
    -->

    <!--
      What a link to the site itself looks like when it is shared. A link to
      one character or one creator gets its own title, words and picture: those
      pages are built per link by the API, since a crawler cannot run the app
      to find out what is on them.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VantaOrigin" />
    <meta property="og:title" content="VantaOrigin: Your characters. One link." />
    <meta
      property="og:description"
      content="Create character cards, organize your characters, and share one simple page with anyone who wants to discover them."
    />
    <meta property="og:url" content="https://www.vantaorigin.com/" />
    <meta property="og:image" content="https://www.vantaorigin.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VantaOrigin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@studio_Vorigin" />
    <meta name="twitter:title" content="VantaOrigin: Your characters. One link." />
    <meta
      name="twitter:description"
      content="Create character cards, organize your characters, and share one simple page with anyone who wants to discover them."
    />
    <meta name="twitter:image" content="https://www.vantaorigin.com/og-default.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "VantaOrigin",
        "url": "https://www.vantaorigin.com/",
        "description": "Create character cards, organize your characters, and share one simple page with anyone who wants to discover them."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Comic+Neue:wght@400;700&family=Inter:wght@400;500;600;700;800;900&family=Instrument+Sans:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
