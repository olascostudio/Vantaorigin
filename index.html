<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>VantaOrigin — Your Characters. Your Realm. One Link.</title>
    <meta
      name="description"
      content="Create a home for your characters, organize their profiles, and share your Realm with one link."
    />
    <meta name="theme-color" content="#1b2233" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.vantaorigin.com/" />

    <!--
      What a link to the site itself looks like when it is shared. A link to
      one character or one Realm gets its own title, words and picture: those
      pages are built per link by the API, since a crawler cannot run the app
      to find out what is on them.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VantaOrigin" />
    <meta property="og:title" content="VantaOrigin — Your Characters. Your Realm. One Link." />
    <meta
      property="og:description"
      content="Create a home for your characters, organize their profiles, and share your Realm with one link."
    />
    <meta property="og:url" content="https://www.vantaorigin.com/" />
    <meta property="og:image" content="https://www.vantaorigin.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VantaOrigin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VantaOrigin — Your Characters. Your Realm. One Link." />
    <meta
      name="twitter:description"
      content="Create a home for your characters, organize their profiles, and share your Realm with one link."
    />
    <meta name="twitter:image" content="https://www.vantaorigin.com/og-default.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "VantaOrigin",
        "url": "https://www.vantaorigin.com/",
        "description": "Create a home for your characters, organize their profiles, and share your Realm with one link."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Comic+Neue:wght@400;700&family=Inter:wght@400;500;600;700;800;900&family=Instrument+Sans:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
