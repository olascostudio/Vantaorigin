# The API sleeps after fifteen idle minutes and takes the better part of a
# minute to wake. Facebook, X and most crawlers give up long before that, so a
# link shared while the API naps would preview as nothing at all. This keeps it
# on its feet.
name: Keep the API awake

on:
  schedule:
    # every ten minutes; GitHub runs these late when it is busy, which is why
    # the gap is shorter than the fifteen minutes it takes to fall asleep
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API
        run: |
          code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" https://api.vantaorigin.com/health)
          echo "health: $code"
          # A sleeping instance answers slowly rather than wrongly, so only a
          # real failure should fail the job.
          test "$code" = "200"
