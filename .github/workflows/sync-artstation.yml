name: Sync ArtStation portfolio

on:
  schedule:
    # Hourly, and read that as a hope rather than a promise: GitHub throttles
    # scheduled runs hard on this repo — asking for every fifteen minutes
    # actually produced one run every two to six hours. Nothing here is
    # urgent, so hourly is honest about what arrives.
    - cron: "17 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-artstation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch latest posts
        run: node scripts/sync-artstation.mjs
        env:
          ARTSTATION_USER: vantaoriginstudio
          # ArtStation answers its JSON endpoints only for addresses it likes.
          # GitHub runners get a 403 challenge page, and so does our own host,
          # while the feed is served to both without complaint — so read the
          # feed and skip a minute of being told no.
          #
          # The feed carries the newest fifty posts but not which album they
          # belong to, so new work lands under "Latest Work" until someone
          # runs "npm run sync:artstation" from a machine ArtStation trusts,
          # which files everything properly again.
          ARTSTATION_FEED_ONLY: "1"

      - name: Commit when something changed
        run: |
          if git diff --quiet -- src/data/portfolio.json; then
            echo "No new work on ArtStation."
            exit 0
          fi
          git config user.name "vantaorigin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/portfolio.json
          git commit -m "Sync ArtStation portfolio"
          git push
